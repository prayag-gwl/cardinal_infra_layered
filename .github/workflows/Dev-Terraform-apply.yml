name: Develop Terraform Apply

on:
  push:
    branches: [ develop ]
    paths:
      - '**/*.tf'
      - '.github/workflows/Dev-Terraform-apply.yml'
  workflow_dispatch:

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: us-east-1
  TF_WORKING_DIR: stacks/dev
  TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
  TF_BACKEND_KEY: ${{ secrets.TF_BACKEND_KEY }}
  TF_BACKEND_REGION: ${{ secrets.TF_BACKEND_REGION }}
  TF_BACKEND_DDB_TABLE: ${{ secrets.TF_BACKEND_DDB_TABLE }}
  TF_BACKEND_KMS_KEY_ID: ${{ secrets.TF_BACKEND_KMS_KEY_ID }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          REGION_VALUE=${TF_BACKEND_REGION:-$AWS_REGION}
          INIT_ARGS=(
            "-input=false"
            "-backend-config=bucket=${TF_BACKEND_BUCKET}"
            "-backend-config=key=${TF_BACKEND_KEY}"
            "-backend-config=region=${REGION_VALUE}"
            "-backend-config=dynamodb_table=${TF_BACKEND_DDB_TABLE}"
          )
          if [ -n "${TF_BACKEND_KMS_KEY_ID:-}" ]; then
            INIT_ARGS+=("-backend-config=kms_key_id=${TF_BACKEND_KMS_KEY_ID}")
          fi
          terraform init "${INIT_ARGS[@]}"

      - name: Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Inspect plan (echo summary only)
        id: inspect
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform show -json tfplan > tfplan.json
          CREATES=$(jq '[.resource_changes[] | select(.change.actions[] | contains("create"))] | length' tfplan.json)
          UPDATES=$(jq '[.resource_changes[] | select(.change.actions[] | contains("update"))] | length' tfplan.json)
          DELETES=$(jq '[.resource_changes[] | select(.change.actions[] | contains("delete"))] | length' tfplan.json)

          echo "Plan summary — creates: $CREATES, updates: $UPDATES, deletes: $DELETES"

          if [ "$CREATES" -eq 0 ] && [ "$UPDATES" -eq 0 ] && [ "$DELETES" -eq 0 ]; then
            echo "::notice ::PLAN RESULT: No changes to apply."
          else
            echo "::warning ::PLAN RESULT: Changes detected."
            jq -r '.resource_changes[] | "\(.type) \(.name): actions=\(.change.actions)"' tfplan.json
          fi

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: stacks/dev/tfplan
