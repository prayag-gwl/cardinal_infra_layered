name: Bootstrap Terraform Backend

on:
  workflow_dispatch:
    inputs:
      enable_kms:
        description: Enable a dedicated KMS key for the state bucket
        type: boolean
        default: false
      kms_alias:
        description: KMS alias to assign when enable_kms is true
        type: string
        default: tf-state-backend
      bucket_force_destroy:
        description: Allow Terraform to delete the bucket even if it is not empty
        type: boolean
        default: false

env:
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: bootstrap/state-backend
  TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
  TF_BACKEND_REGION: ${{ secrets.TF_BACKEND_REGION }}
  TF_BACKEND_DDB_TABLE: ${{ secrets.TF_BACKEND_DDB_TABLE }}

jobs:
  bootstrap:
    if: env.TF_BACKEND_BUCKET != '' && env.TF_BACKEND_REGION != '' && env.TF_BACKEND_DDB_TABLE != ''
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.TF_BACKEND_REGION }}

      - name: Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_region: ${{ env.TF_BACKEND_REGION }}
          TF_VAR_bucket_name: ${{ env.TF_BACKEND_BUCKET }}
          TF_VAR_dynamodb_table_name: ${{ env.TF_BACKEND_DDB_TABLE }}
          TF_VAR_bucket_force_destroy: ${{ inputs.bucket_force_destroy }}
          TF_VAR_enable_kms: ${{ inputs.enable_kms }}
          TF_VAR_kms_alias: ${{ inputs.kms_alias }}
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Upload plan
        if: success() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-tfplan
          path: bootstrap/state-backend/tfplan

      - name: Apply
        if: success() && steps.plan.outcome == 'success'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_region: ${{ env.TF_BACKEND_REGION }}
          TF_VAR_bucket_name: ${{ env.TF_BACKEND_BUCKET }}
          TF_VAR_dynamodb_table_name: ${{ env.TF_BACKEND_DDB_TABLE }}
          TF_VAR_bucket_force_destroy: ${{ inputs.bucket_force_destroy }}
          TF_VAR_enable_kms: ${{ inputs.enable_kms }}
          TF_VAR_kms_alias: ${{ inputs.kms_alias }}
        run: terraform apply -input=false -auto-approve tfplan

