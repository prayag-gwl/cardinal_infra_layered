name: USW1 Terraform Plan

on:
  push:
    branches: [ develop ]
    paths:
      - '**/*.tf'
      - '.github/workflows/USW1-Terraform-plan.yml'
  workflow_dispatch:

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: ${{ vars.USW1_AWS_REGION }}
  TF_WORKING_DIR: stacks/prod
  TF_BACKEND_BUCKET: ${{ secrets.USW1_TF_BACKEND_BUCKET }}
  TF_BACKEND_KEY: ${{ secrets.USW1_TF_BACKEND_KEY }}
  TF_BACKEND_REGION: ${{ secrets.USW1_TF_BACKEND_REGION }}
  TF_BACKEND_DDB_TABLE: ${{ secrets.USW1_TF_BACKEND_DDB_TABLE }}
  TF_BACKEND_KMS_KEY_ID: ${{ secrets.USW1_TF_BACKEND_KMS_KEY_ID }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.USW1_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Export Terraform variables
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        env:
          PROJECT: ${{ vars.USW1_PROJECT }}
          ENVIRONMENT: ${{ vars.USW1_ENVIRONMENT }}
          AWS_REGION_VAR: ${{ vars.USW1_AWS_REGION }}
          AZS: ${{ vars.USW1_AZS || '' }}
          PUBLIC_SUBNET_CIDRS: ${{ vars.USW1_PUBLIC_SUBNET_CIDRS || '' }}
          PRIVATE_SUBNET_CIDRS: ${{ vars.USW1_PRIVATE_SUBNET_CIDRS || '' }}
          DATA_SUBNET_CIDRS: ${{ vars.USW1_DATA_SUBNET_CIDRS || '' }}
          FRONTEND_IMAGE: ${{ vars.USW1_FRONTEND_IMAGE }}
          BACKEND_IMAGE: ${{ vars.USW1_BACKEND_IMAGE }}
          FRONTEND_CERTIFICATE_ARN: ${{ vars.USW1_FRONTEND_CERTIFICATE_ARN || '' }}
          BACKEND_CERTIFICATE_ARN: ${{ vars.USW1_BACKEND_CERTIFICATE_ARN || '' }}
          WAF_WEB_ACL_ARN: ${{ vars.USW1_WAF_WEB_ACL_ARN || '' }}
          CREATE_RDS: ${{ vars.USW1_CREATE_RDS || 'false' }}
          DATABASE_SECRET_ARN: ${{ vars.USW1_DATABASE_SECRET_ARN || '' }}
          DATABASE_NAME: ${{ vars.USW1_DATABASE_NAME || '' }}
          EXISTING_RDS_IDENTIFIER: ${{ vars.USW1_EXISTING_RDS_IDENTIFIER || '' }}
          DB_MASTER_USERNAME: ${{ vars.USW1_DB_MASTER_USERNAME || '' }}
          DB_MASTER_PASSWORD: ${{ secrets.USW1_DB_MASTER_PASSWORD || '' }}
          DB_ENGINE_VERSION: ${{ vars.USW1_DB_ENGINE_VERSION || '17.7' }}
          VPC_CIDR: ${{ vars.USW1_VPC_CIDR }}
          BACKUP_KMS_KEY_ARN: ${{ vars.USW1_BACKUP_KMS_KEY_ARN || '' }}
        run: |
          set -euo pipefail
          required_vars=(
            AWS_REGION_VAR
            VPC_CIDR
            AZS
            PUBLIC_SUBNET_CIDRS
            PRIVATE_SUBNET_CIDRS
            FRONTEND_IMAGE
            BACKEND_IMAGE
          )
          
          # Conditional required vars based on CREATE_RDS
          if [ "${CREATE_RDS}" = "true" ]; then
            required_vars+=("DB_MASTER_USERNAME" "DB_MASTER_PASSWORD")
          else
            required_vars+=("DATABASE_SECRET_ARN" "DATABASE_NAME" "EXISTING_RDS_IDENTIFIER")
          fi

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error ::Missing repository variable: ${var_name}" >&2
              exit 1
            fi
          done

          to_json_array() {
            local raw="${1:-}"
            if [ -z "$raw" ]; then
              printf '[]'
            else
              printf '%s' "$raw" | jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))'
            fi
          }

          AZS_JSON=$(to_json_array "$AZS")
          PUBLIC_SUBNETS_JSON=$(to_json_array "$PUBLIC_SUBNET_CIDRS")
          PRIVATE_SUBNETS_JSON=$(to_json_array "$PRIVATE_SUBNET_CIDRS")
          DATA_SUBNETS_JSON=$(to_json_array "$DATA_SUBNET_CIDRS")

          project_value=${PROJECT:-cardinal}
          environment_value=${ENVIRONMENT:-prod}

          echo "TF_VAR_aws_region=$AWS_REGION_VAR" >> "$GITHUB_ENV"
          echo "TF_VAR_project=$project_value" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=$environment_value" >> "$GITHUB_ENV"
          echo "TF_VAR_vpc_cidr=$VPC_CIDR" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_image=$FRONTEND_IMAGE" >> "$GITHUB_ENV"
          echo "TF_VAR_backend_image=$BACKEND_IMAGE" >> "$GITHUB_ENV"
          echo "TF_VAR_create_rds=$CREATE_RDS" >> "$GITHUB_ENV"
          echo "TF_VAR_azs=$AZS_JSON" >> "$GITHUB_ENV"
          echo "TF_VAR_public_subnet_cidrs=$PUBLIC_SUBNETS_JSON" >> "$GITHUB_ENV"
          echo "TF_VAR_private_subnet_cidrs=$PRIVATE_SUBNETS_JSON" >> "$GITHUB_ENV"
          echo "TF_VAR_data_subnet_cidrs=$DATA_SUBNETS_JSON" >> "$GITHUB_ENV"
          
          # RDS-related variables (conditional)
          if [ "${CREATE_RDS}" = "true" ]; then
            echo "TF_VAR_db_master_username=$DB_MASTER_USERNAME" >> "$GITHUB_ENV"
            echo "TF_VAR_db_master_password=$DB_MASTER_PASSWORD" >> "$GITHUB_ENV"
            echo "TF_VAR_db_engine_version=$DB_ENGINE_VERSION" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_database_secret_arn=$DATABASE_SECRET_ARN" >> "$GITHUB_ENV"
            echo "TF_VAR_database_name=$DATABASE_NAME" >> "$GITHUB_ENV"
            echo "TF_VAR_existing_rds_identifier=$EXISTING_RDS_IDENTIFIER" >> "$GITHUB_ENV"
          fi

          append_optional() {
            local name="$1"
            local value="${2:-}"
            if [ -n "$value" ]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          }

          append_optional "TF_VAR_frontend_certificate_arn" "$FRONTEND_CERTIFICATE_ARN"
          append_optional "TF_VAR_backend_certificate_arn" "$BACKEND_CERTIFICATE_ARN"
          append_optional "TF_VAR_waf_web_acl_arn" "$WAF_WEB_ACL_ARN"
          append_optional "TF_VAR_backup_kms_key_arn" "$BACKUP_KMS_KEY_ARN"

      - name: Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          : "${TF_BACKEND_BUCKET:?TF_BACKEND_BUCKET secret is required}"
          : "${TF_BACKEND_KEY:?TF_BACKEND_KEY secret is required}"
          : "${TF_BACKEND_DDB_TABLE:?TF_BACKEND_DDB_TABLE secret is required}"
          REGION_VALUE=${TF_BACKEND_REGION:-$AWS_REGION}
          INIT_ARGS=(
            "-input=false"
            "-backend-config=bucket=${TF_BACKEND_BUCKET}"
            "-backend-config=key=${TF_BACKEND_KEY}"
            "-backend-config=region=${REGION_VALUE}"
            "-backend-config=dynamodb_table=${TF_BACKEND_DDB_TABLE}"
            "-backend-config=use_lockfile=true"
          )
          if [ -n "${TF_BACKEND_KMS_KEY_ID:-}" ]; then
            INIT_ARGS+=("-backend-config=kms_key_id=${TF_BACKEND_KMS_KEY_ID}")
          fi
          terraform init "${INIT_ARGS[@]}"

      - name: Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Inspect plan (echo summary only)
        id: inspect
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform show -json tfplan > tfplan.json
          CREATES=$(jq '[.resource_changes[] | select(.change.actions[] | contains("create"))] | length' tfplan.json)
          UPDATES=$(jq '[.resource_changes[] | select(.change.actions[] | contains("update"))] | length' tfplan.json)
          DELETES=$(jq '[.resource_changes[] | select(.change.actions[] | contains("delete"))] | length' tfplan.json)

          echo "Plan summary — creates: $CREATES, updates: $UPDATES, deletes: $DELETES"

          if [ "$CREATES" -eq 0 ] && [ "$UPDATES" -eq 0 ] && [ "$DELETES" -eq 0 ]; then
            echo "::notice ::PLAN RESULT: No changes to apply."
          else
            echo "::warning ::PLAN RESULT: Changes detected."
            jq -r '.resource_changes[] | "\(.type) \(.name): actions=\(.change.actions)"' tfplan.json
          fi

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: stacks/prod/tfplan

